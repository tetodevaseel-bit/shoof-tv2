name: Build Shoof TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest-16-cores
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Install SDK 36 + NDK 27 + Build Tools
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.1.0"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Install ccache
        run: |
          sudo apt-get install -y ccache
          ccache --max-size=5G
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-tv2-arm64-v1
          restore-keys: |
            ${{ runner.os }}-ccache-tv2-arm64-
            ${{ runner.os }}-ccache-tv2-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-tv2-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-tv2-

      - run: chmod +x gradlew

      - name: Build APK (arm64 only)
        run: |
          ./gradlew :TMessagesProj_App:assembleDebug \
            --no-daemon \
            --build-cache \
            --max-workers 2
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m"
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: shoof-tv-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          retention-days: 30
